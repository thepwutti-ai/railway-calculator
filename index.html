<title>Railways of the Lost Atlas — Train Run Calculator</title>
<style>
:root{--bg:#0a0a0a;--panel:#111;--card:#1a1a1a;--card2:#222;--gold:#f0b429;--gold2:#b8881e;--red:#7d1a2e;--green:#3a9e50;--text:#f0ede0;--muted:#7a776a;--border:#2e2b24;--input:#070707}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;background-image:repeating-linear-gradient(0deg,transparent,transparent 40px,#f0b42905 40px,#f0b42905 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,#f0b42905 40px,#f0b42905 41px)}button,select,input{font:inherit}button{cursor:pointer}header{background:#0c0c0c;border-bottom:3px solid var(--gold);padding:18px 16px}.head{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:1.5rem}h1{font-size:1.35rem;color:var(--gold)}.sub{font-size:.76rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}.wrap{max-width:1100px;margin:auto;padding:20px 14px}.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--gold2)}.tab,.addtab{padding:8px 13px;background:#0f0f0f;color:var(--muted);border:1px solid var(--border);border-bottom:0;border-radius:9px 9px 0 0;font-weight:700}.tab.active{background:var(--card);color:var(--gold);border-color:var(--gold2)}.addtab{color:var(--gold);border-style:dashed;background:transparent}.panel{background:var(--panel);border:1px solid var(--border);border-top:0;border-radius:0 12px 12px 12px;padding:20px;box-shadow:0 6px 30px #000b}.block{margin-bottom:24px}.block:last-child{margin-bottom:0}.title{color:var(--gold);font-size:.86rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);padding-bottom:9px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;margin-bottom:5px}select,input{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:9px 10px;outline:0}select:focus,input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px #f0b42920}.btn{border:0;border-radius:7px;padding:9px 14px;font-weight:800;color:#fff;background:var(--red)}.btn.secondary{background:var(--card2);border:1px solid var(--border)}.btn.danger{background:transparent;border:1px solid var(--red);color:#c07080;padding:5px 9px}.small{padding:6px 10px;font-size:.8rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.train{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:9px;padding:14px;margin-bottom:10px}.trainhead{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}.badge{background:var(--red);border-radius:6px;padding:4px 10px;font-weight:800}.total{margin-left:auto;color:var(--gold);font-size:1.05rem;font-weight:900}.stops{display:flex;gap:7px;align-items:end;flex-wrap:wrap}.stop{display:flex;flex-direction:column;align-items:center;gap:4px}.stop label{font-size:.66rem;color:var(--muted);text-transform:uppercase}.stop select{width:72px;text-align:center;color:var(--gold);font-weight:800;padding:8px 3px}.arrow{color:#4b463c;font-size:1.1rem;padding-bottom:8px}.result{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}.center{text-align:center;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.big{text-align:center;color:var(--gold);font-size:2.7rem;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{border:1px solid var(--border);background:var(--input);border-radius:20px;padding:4px 10px;font-size:.8rem}.chip b{color:var(--gold)}.toggle{display:grid;grid-template-columns:1fr 1fr;margin:14px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden}.toggle button{padding:10px;border:0;background:var(--input);color:var(--muted);font-weight:800}.toggle .pay.active{background:var(--green);color:#fff}.toggle .withhold.active{background:var(--red);color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat .v{color:var(--gold);font-size:1.4rem;font-weight:900}.stat .l{color:var(--muted);font-size:.72rem;margin-top:3px}.stock{margin-top:12px;border-radius:8px;padding:11px;text-align:center;font-weight:800}.stock-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.stock-update{margin-top:8px}.stock-update:disabled{opacity:.5;cursor:default}.stock-updated{color:#6fc87e;font-size:.78rem;font-weight:700}.up{background:#0a180c;border:1px solid var(--green);color:#6fc87e}.down{background:#140810;border:1px solid var(--red);color:#c07080}.same{background:#141410;border:1px solid var(--border);color:var(--muted)}.share{display:grid;grid-template-columns:1fr 100px 90px 40px;gap:8px;align-items:center;margin-bottom:8px}.receive{text-align:right;color:var(--gold);font-weight:900}.info{color:#a8b890;background:#101a10;border-left:3px solid var(--green);padding:9px 11px;border-radius:6px;font-size:.8rem;margin-top:10px}.note{color:var(--muted);font-size:.76rem;line-height:1.5;margin-top:8px}footer{text-align:center;color:#3a3528;font-size:.7rem;margin-top:20px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.share{grid-template-columns:1fr 82px 70px 38px}}@media(max-width:480px){.grid,.stats{grid-template-columns:1fr}.panel{padding:14px}.total{margin-left:0;width:100%}.share{grid-template-columns:1fr 75px 65px 35px}}

function makeCompany(name="Adaptive Company"){const i=COMPANIES.find(x=>x.name===name)||COMPANIES[0];return{id:S.cid++,name:i.name,type:i.type,stock:80,trains:[],mode:"payout",shareholders:[],treasury:0,stockAppliedSignature:null}}
function active(){return S.companies.find(c=>c.id===S.active)}
function addCompany(){const c=makeCompany();S.companies.push(c);S.active=c.id;render()}
function removeCompany(id){if(S.companies.length<2)return;S.companies=S.companies.filter(c=>c.id!==id);if(S.active===id)S.active=S.companies.at(-1).id;render()}
function setActive(id){S.active=id;render()}
function addTrain(type){const c=active();c.trains.push({id:S.tid++,type,stops:type==="inf"?[0]:Array(Number(type)).fill(0)});c.stockAppliedSignature=null;render()}
function removeTrain(id){const c=active();c.trains=c.trains.filter(t=>t.id!==id);c.stockAppliedSignature=null;render()}
function setStop(tid,i,v){const c=active(),t=c.trains.find(t=>t.id===tid);if(t){t.stops[i]=Math.max(0,Number(v)||0);c.stockAppliedSignature=null}render()}
function addStop(tid){const c=active(),t=c.trains.find(t=>t.id===tid);if(t){t.stops.push(0);c.stockAppliedSignature=null}render()}
function removeStop(tid){const c=active(),t=c.trains.find(t=>t.id===tid);if(t&&t.stops.length){t.stops.pop();c.stockAppliedSignature=null}render()}
function limit(t){return t.type==="inf"?Infinity:Number(t.type)}
function trainValue(t){return t.stops.slice(0,limit(t)).reduce((a,v)=>a+(Number(v)||0),0)}
function earnings(c){return c.trains.reduce((a,t)=>a+trainValue(t),0)}
function rate(c){return c.type==="minor"?.20:.10}
function perShare(c,e){return Math.floor(e*rate(c))}
function routeSignature(c){return JSON.stringify({mode:c.mode,trains:c.trains.map(t=>({type:t.type,stops:t.stops}))})}
function stockMove(c,e){const i=Math.max(0,STOCK.indexOf(c.stock));let d=0;if(!c.trains.length||c.mode==="withhold"||e===0)d=-1;else if(e>=c.stock*2)d=2;else if(e>=c.stock)d=1;const ni=Math.max(0,Math.min(STOCK.length-1,i+d));return{d,old:c.stock,new:STOCK[ni]}}
function applyStockUpdate(){const c=active();if(!c)return;const e=earnings(c),m=stockMove(c,e);if(m.new!==m.old){c.stock=m.new;c.stockAppliedSignature=routeSignature(c);render()}}
function setCompany(name){const c=active(),i=COMPANIES.find(x=>x.name===name);if(i){c.name=i.name;c.type=i.type}render()}
function addShare(){active().shareholders.push({id:S.sid++,name:"",shares:1});render()}
function delShare(id){const c=active();c.shareholders=c.shareholders.filter(s=>s.id!==id);render()}
function setMode(m){const c=active();c.mode=m;c.stockAppliedSignature=null;render()}
function companyOptions(c){return [["Minor Companies","minor"],["Major Corporations","major"],["Neutral Corporation","metropolitan"]].map(([g,t])=>`<optgroup label="${g}">${COMPANIES.filter(x=>x.type===t).map(x=>`<option ${x.name===c.name?"selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>`).join("")}
function stockOptions(v){return STOCK.map(x=>`<option value="${x}" ${x===v?"selected":""}>${x}</option>`).join("")}
function stopOptions(v){return Array.from({length:11},(_,i)=>i*10).map(x=>`<option value="${x}" ${x===Number(v)?"selected":""}>${x}</option>`).join("")}
function renderTabs(){
 const ordered=[...S.companies].sort((a,b)=>b.stock-a.stock||a.name.localeCompare(b.name));
 document.getElementById("tabs").innerHTML=ordered.map(c=>{
   const image=COMPANY_IMAGES[c.name];
   const shortName=c.name.replace(" Company","").replace(" Corporation","");
   return `<button class="tab ${c.id===S.active?"active":""}" onclick="setActive(${c.id})">
     ${image?`<img class="tab-logo" src="${image}" alt="" aria-hidden="true">`:""}
     <span class="tab-name">${esc(shortName)}</span>
     <span class="tab-price">${c.stock}</span>
     ${S.companies.length>1?`<span class="tab-close" onclick="event.stopPropagation();removeCompany(${c.id})">×</span>`:""}
   </button>`;
 }).join("")+`<button class="addtab" onclick="addCompany()">＋</button>`
}
function trainHTML(t){const n=t.type==="inf"?t.stops.length:Number(t.type);let h="";for(let i=0;i<n;i++){if(i)h+=`<span class="arrow">›</span>`;h+=`<div class="stop"><label>Stop ${i+1}</label><select onchange="setStop(${t.id},${i},this.value)">${stopOptions(t.stops[i]||0)}</select></div>`}return `<div class="train"><div class="trainhead"><span class="badge">${t.type==="inf"?"∞":t.type}-Train</span><span style="color:var(--muted);font-size:.78rem">${t.type==="inf"?"Unlimited stops":"Up to "+n+" stops"}</span><span class="total">${trainValue(t)}</span><button class="btn danger small" onclick="removeTrain(${t.id})">✕</button></div><div class="stops">${h}</div>${t.type==="inf"?`<div class="actions"><button class="btn secondary small" onclick="addStop(${t.id})">＋ Add Stop</button>${t.stops.length?`<button class="btn danger small" onclick="removeStop(${t.id})">− Remove Last</button>`:""}</div>`:""}</div>`}
function shareholdersHTML(c,p){return c.shareholders.map(s=>`<div class="share"><input value="${esc(s.name)}" placeholder="Player name" onchange="active().shareholders.find(x=>x.id===${s.id}).name=this.value"><input type="number" min="0" value="${s.shares}" onchange="active().shareholders.find(x=>x.id===${s.id}).shares=Math.max(0,Number(this.value)||0);render()"><div class="receive">${c.mode==="payout"?"+"+Math.floor(p*s.shares):"—"}</div><button class="btn danger small" onclick="delShare(${s.id})">✕</button></div>`).join("")}
function render(){renderTabs();const c=active();if(!c)return;const e=earnings(c),p=perShare(c,e),sm=stockMove(c,e),sig=routeSignature(c),applied=c.stockAppliedSignature===sig,treasury=c.mode==="withhold"?e:Math.floor(p*c.treasury);const chips=c.trains.map(t=>`<span class="chip">${t.type==="inf"?"∞":t.type}-Train: <b>${trainValue(t)}</b></span>`).join("");const displayMove=applied?{d:0,old:c.stock,new:c.stock}:sm;const cls=displayMove.d>0?"up":displayMove.d<0?"down":"same";const text=applied?"✓ Stock price updated":displayMove.d>0?`⬆ Stock rises ${displayMove.d} increment${displayMove.d>1?"s":""}`:displayMove.d<0?"⬇ Stock falls 1 increment":"➡ Stock unchanged";document.getElementById("app").innerHTML=`<section class="panel">
<div class="block"><div class="title">Company</div><div class="grid"><div class="field"><label>Company / Corporation</label><select onchange="setCompany(this.value)">${companyOptions(c)}</select></div><div class="field"><label>Type</label><select disabled><option>${c.type==="minor"?"Minor Company":c.type==="major"?"Major Corporation":"Metropolitan — Neutral Corporation"}</option></select></div><div class="field"><label>Stock Price</label><select onchange="active().stock=Number(this.value);active().stockAppliedSignature=null;render()">${stockOptions(c.stock)}</select></div></div><div class="note">Company abilities are intentionally not modeled. Enter the final route/stop values according to the rules being used.</div></div>
<div class="block"><div class="title">Trains & Routes</div>${c.trains.length?c.trains.map(trainHTML).join(""):`<div class="info">No trains. Earnings are 0 and stock falls one increment.</div>`}<div class="actions"><select id="newTrain" style="width:auto"><option value="2">2-Train</option><option value="3">3-Train</option><option value="4">4-Train</option><option value="5">5-Train</option><option value="6">6-Train</option><option value="7">7-Train</option><option value="inf">∞-Train</option></select><button class="btn" onclick="addTrain(newTrain.value)">＋ Add Train</button>${c.trains.length?`<button class="btn secondary" onclick="active().trains=[];active().stockAppliedSignature=null;render()">Clear Trains</button>`:""}</div></div>
<div class="block"><div class="title">Results</div><div class="result"><div class="center">Total Earnings</div><div class="big">${e}</div><div class="chips">${chips||`<span class="chip">No routes</span>`}</div><div class="toggle"><button class="pay ${c.mode==="payout"?"active":""}" onclick="setMode('payout')">✓ Pay Out</button><button class="withhold ${c.mode==="withhold"?"active":""}" onclick="setMode('withhold')">🏦 Withhold</button></div><div class="stats"><div class="stat"><div class="v">${c.mode==="payout"?p:"—"}</div><div class="l">Per Share (${rate(c)*100}%)</div></div><div class="stat"><div class="v">${treasury}</div><div class="l">${c.mode==="withhold"?"Into Treasury":"Treasury Payout"}</div></div></div><div class="stock ${cls}"><div class="stock-row"><span>${text}</span>${!applied && sm.new!==sm.old?`<button class="btn secondary small stock-update" onclick="applyStockUpdate()">Update Stock to ${sm.new}</button>`:""}</div></div><div class="center" style="margin-top:7px">${displayMove.old} → ${displayMove.new}</div>${applied?`<div class="stock-updated" style="text-align:center;margin-top:6px">Stock price has been applied. Change the route or payout mode to calculate a new movement.</div>`:""}</div></div>
<div class="block"><div class="title">Shareholders</div><div class="share" style="color:var(--muted);font-size:.7rem;text-transform:uppercase"><div>Name</div><div>Shares</div><div style="text-align:right">Receives</div><div></div></div>${shareholdersHTML(c,p)||`<div class="note">No shareholders added.</div>`}<div class="actions"><button class="btn secondary small" onclick="addShare()">＋ Add Shareholder</button></div><div style="border-top:1px solid var(--border);margin-top:15px;padding-top:14px"><div class="field" style="max-width:160px"><label>Shares in Treasury</label><input type="number" min="0" value="${c.treasury}" onchange="active().treasury=Math.max(0,Number(this.value)||0);render()"></div></div></div>
</section>`}
addCompany();const c=active();c.shareholders=[{id:S.sid++,name:"Player 1",shares:2},{id:S.sid++,name:"Player 2",shares:1}];c.trains.push({id:S.tid++,type:"2",stops:[0,0]});render();
</script>
</body></html>
